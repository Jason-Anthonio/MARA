# Generated ros2_control controllers
# Publishes joint states on: /joint_states
# Command topics use: /<controller_name>/commands
# std_msgs/msg/Float64MultiArray "{data: [0,0,0,0,0]}"

/**:
  controller_manager:
    ros__parameters:
      update_rate: 100

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      position_controller:
        type: forward_command_controller/ForwardCommandController
      trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController
      velocity_controller:
        type: forward_command_controller/ForwardCommandController

  joint_state_broadcaster:
    ros__parameters: {}

  # Command topic: /position_controller/commands
  position_controller:
    ros__parameters:
      joints: [J1_yaw_base_shoulderLink, J2_pitch_shoulder, J4_pitch_elbow, J6_pitch_wrist, J9_horn_drive]
      interface_name: position

  # FollowJointTrajectory action: /trajectory_controller/follow_joint_trajectory
  # Topic: /trajectory_controller/joint_trajectory
  trajectory_controller:
    ros__parameters:
      joints: [J1_yaw_base_shoulderLink, J2_pitch_shoulder, J4_pitch_elbow, J6_pitch_wrist, J9_horn_drive]
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity

  # Command topic: /velocity_controller/commands
  velocity_controller:
    ros__parameters:
      joints: [J1_yaw_base_shoulderLink, J2_pitch_shoulder, J4_pitch_elbow, J6_pitch_wrist, J9_horn_drive]
      interface_name: velocity
